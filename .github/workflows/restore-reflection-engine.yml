name: Restore reflection engine

on:
  push:
    paths:
      - .github/workflows/restore-reflection-engine.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file and remove temporary workflow
        run: |
          git checkout 3292ca2aa49d473f98be066574889ec3ab92249f -- reflection_engine.py
          git rm .github/workflows/restore-reflection-engine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reflection_engine.py
          git commit -m "fix: restore reflection engine"
          git push
